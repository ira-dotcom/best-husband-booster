<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>best husband booster pack</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{overflow:hidden;background:radial-gradient(120% 120% at 50% 0%,#faf7f0,#e7e3d9);font-family:'Patrick Hand',cursive;color:#4a453d;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#pack{width:min(78vw,420px);border-radius:16px;box-shadow:0 18px 40px rgba(90,80,60,.35);cursor:pointer;animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
.hint{font-size:24px;letter-spacing:1px;opacity:.85;animation:pulse 1.6s ease-in-out infinite;text-align:center}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.hidden{display:none!important}
#cardArea{display:flex;flex-direction:column;align-items:center;gap:16px}
#card{width:min(76vw,380px);aspect-ratio:.74;perspective:1200px;cursor:pointer}
#inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.9,.25,1.15);border-radius:16px}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;overflow:hidden;box-shadow:0 18px 36px rgba(90,80,60,.35);background:#f3efe6}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.back{transform:rotateY(180deg)}
#card.pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{0%{transform:translateY(40%) scale(.45) rotate(8deg)}100%{transform:translateY(0) scale(1) rotate(0)}}
#card.gone{animation:gone .55s ease-in forwards}
@keyframes gone{100%{transform:translateY(-130%) rotate(-20deg);opacity:0}}
#caption{font-size:24px;letter-spacing:1px;opacity:.85;min-height:30px;text-align:center}
.badge{position:absolute;top:12px;right:12px;background:#c0392b;color:#fff;font-size:18px;padding:4px 12px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.25);z-index:3}
.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 48%,transparent 62%);animation:shine 1.8s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
#finale{display:flex;flex-direction:column;align-items:center;gap:14px}
#wish{width:min(86vw,520px);border-radius:14px;box-shadow:0 18px 40px rgba(90,80,60,.35)}
#again{font-family:'Patrick Hand',cursive;font-size:22px;padding:10px 22px;border-radius:999px;border:2px solid #4a453d;background:transparent;color:#4a453d;cursor:pointer}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="stage">
  <img id="pack" src="assets/pack.jpg" alt="best husband booster pack">
  <div class="hint" id="hint">tap to open your pack</div>
  <div id="cardArea" class="hidden">
    <div id="card"><div id="inner">
      <div class="face front"><img src="assets/cardback.jpg" alt=""></div>
      <div class="face back"><img id="cardImg" src="assets/cardback.jpg" alt=""><div class="badge hidden" id="badge">rare pull</div></div>
    </div></div>
    <div id="caption">tap to flip</div>
  </div>
  <div id="finale" class="hidden">
    <img id="wish" src="assets/wish.jpg" alt="happy birthday">
    <button id="again">open another pack</button>
  </div>
</div>
<script>
const cards=[
 {img:'assets/cuddle.jpg',name:'cuddle point'},
 {img:'assets/forehead.jpg',name:'forehead kiss'},
 {img:'assets/smooch.jpg',name:'smooch',rare:true},
 {img:'assets/poop.jpg',name:'poop time'},
 {img:'assets/dishes.jpg',name:'dish pass'}
];
let phase='pack',idx=0,flipped=false;
const pack=document.getElementById('pack'),hint=document.getElementById('hint'),
cardArea=document.getElementById('cardArea'),card=document.getElementById('card'),
inner=document.getElementById('inner'),cardImg=document.getElementById('cardImg'),
badge=document.getElementById('badge'),caption=document.getElementById('caption'),
finale=document.getElementById('finale'),faceUp=document.querySelector('.face.back');
function confetti(n){const cols=['#e8a3a3','#f2c94c','#7fb8d8','#b8e0a0','#e6b8d8'];for(let i=0;i<n;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.animationDuration=(2.2+Math.random()*1.6)+'s';c.style.animationDelay=(Math.random()*0.8)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4500);}}
pack.addEventListener('click',()=>{if(phase!=='pack')return;phase='opening';pack.style.animation='shake .55s ease-in-out';setTimeout(()=>{pack.style.animation='burst .5s ease-out forwards';setTimeout(()=>{pack.classList.add('hidden');hint.classList.add('hidden');showCard();},480);},560);});
function showCard(){phase='cards';idx=0;flipped=false;cardArea.classList.remove('hidden');inner.style.transform='rotateY(0)';cardImg.src='assets/cardback.jpg';badge.classList.add('hidden');faceUp.classList.remove('shine');caption.textContent='tap to flip';card.classList.add('pop');}
function nextCard(){idx++;flipped=false;if(idx>=cards.length){cardArea.classList.add('hidden');finale.classList.remove('hidden');confetti(80);return;}inner.style.transform='rotateY(0)';cardImg.src='assets/cardback.jpg';badge.classList.add('hidden');faceUp.classList.remove('shine');card.classList.add('pop');caption.textContent=(idx===cards.length-1)?'one more\u2026':'tap to flip';}
card.addEventListener('click',()=>{if(phase!=='cards')return;
 if(!flipped){flipped=true;const c=cards[idx];inner.style.transform='rotateY(180deg)';setTimeout(()=>{cardImg.src=c.img;if(c.rare){badge.classList.remove('hidden');faceUp.classList.add('shine');}},380);caption.textContent=(idx===cards.length-1)?'one more\u2026':'tap for the next one';}
 else{card.classList.add('gone');}
});
document.getElementById('again').addEventListener('click',()=>location.reload());
card.addEventListener('animationend',e=>{if(e.animationName==='pop')card.classList.remove('pop');if(e.animationName==='gone')nextCard();});
cards.forEach(c=>{const i=new Image();i.src=c.img;});new Image().src='assets/cardback.jpg';
</script>
</body>
</html>
